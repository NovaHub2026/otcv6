name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build and typecheck
        run: npm run build
      - name: Unit tests
        run: npx vitest run --project unit

  statistical-gate:
    name: Statistical Gate
    runs-on: ubuntu-latest
    # Statistical suites are long-running simulations. They gate integration into
    # main and can be triggered on demand, but do not block every push.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Statistical tests
        # The phase-acceptance run holds ~24M ticks in typed arrays plus the
        # precomputed feature frame, which needs more heap than the default.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --project statistical
