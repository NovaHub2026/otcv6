name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A push to main must never cancel the run of the commit before it: the run
  # of `c736707` ("that was the gate failure") was cancelled 58 s later by a
  # docs push and the fix has no hosted result at all (out-of-band audit,
  # a7-24). Superseding is for branches, where the newest push is all that
  # matters; on main every commit is trusted integrated state and each one
  # gets its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      # Build precedes lint deliberately. The type-aware ESLint rules resolve
      # workspace types through each package's emitted declarations, so on a
      # clean checkout `lint` reports every cross-package type as unresolved.
      # This ordering defect was invisible locally for four cycles because a
      # previous build's `dist/` is always lying around; the first CI run that
      # actually executed found it in under a minute.
      - name: Build and typecheck
        run: npm run build
      # The browser app and this repository's own configuration are outside
      # `tsc -b`: the first is `noEmit` and outside the reference graph, the
      # second is in no TypeScript program at all. Both were found the hard way —
      # PH-18.2 for the app, Cycle Audit 6 (C-1) for the config, where two
      # options that do not exist had been silently ignored for a whole cycle.
      - name: Typecheck the browser app
        run: npm run typecheck:web
      - name: Typecheck the repository configuration
        run: npm run typecheck:config
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  statistical-gate:
    name: Statistical Gate
    runs-on: ubuntu-latest
    # Runs on every push to main as well as on pull requests.
    #
    # It was skipped on push while the repository was private, because Actions
    # minutes cost money and these are long-running simulations. The repository
    # is public now and standard-runner minutes are free, so the reason is gone —
    # and this suite is where every substantive claim in the project lives: the
    # adversarial battery, the mirror test, the withheld red-team families, the
    # economic-blindness demonstration, the long-horizon coverage.
    #
    # Leaving it off `main` would mean the project's actual evidence was still
    # attested only by the operator who produced it, which is the thing hosted CI
    # was reinstated to fix (ADR-0009).
    # 90 until 2026-09-04, when this job was cancelled at the ceiling after
    # 1h30m and left a merge of `main` with no statistical verdict at all.
    # PH-24.17 recalibrated the engine to print three to four times as many
    # ticks per candle at the same dispersion, and every suite that samples in
    # ticks got proportionally longer: the same suite that took ~40 minutes here
    # on 2026-09-03 no longer fits. The suite runs serially by design
    # (`--no-file-parallelism`, CA6-01), so this is single-core time and a
    # bigger runner would not help. Raised with room to see the growth rather
    # than to hide it; the cost of a cancelled three-hour job is a merge nobody
    # can trust, and the cost of the ceiling is minutes that are free on a
    # public repository.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps/api suites spawn the built service as a child process, so this
      # job needs the build too. Without it they fail as `service exited (1)`.
      - name: Build
        run: npm run build
      # The browser, and the system libraries it links against. `playwright
      # install chromium` alone downloads the binary and none of the libraries,
      # which is why the panel suite skips on a developer machine without root
      # and must not skip here: `OTC_REQUIRE_BROWSER=1` turns a missing browser
      # into a failure. Cycle Audit 6 (CA6-10) found 2,050 tests and not one
      # that referenced `apps/web/src`; three real defects reached the Human
      # Owner through that hole in one day. A browser coverage layer that can
      # silently disappear is the same hole with a longer fuse.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Statistical tests
        # The phase-acceptance run holds ~24M ticks in typed arrays plus the
        # precomputed feature frame, which needs more heap than the default.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OTC_REQUIRE_BROWSER: '1'
        # `npm run test:stat`, not a bare vitest invocation. The script carries
        # `--no-file-parallelism`, and Cycle Audit 6 (CA6-01) found that the
        # setting could not live in the config: Vitest 3 drops it inside a
        # project block. Without it this job reported 4,664 seconds of test time
        # inside a 718-second run — five files at a time on a two-core runner —
        # and failed on a throughput floor that was measuring the contention.
        run: npm run test:stat
