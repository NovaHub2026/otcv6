name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      # Build precedes lint deliberately. The type-aware ESLint rules resolve
      # workspace types through each package's emitted declarations, so on a
      # clean checkout `lint` reports every cross-package type as unresolved.
      # This ordering defect was invisible locally for four cycles because a
      # previous build's `dist/` is always lying around; the first CI run that
      # actually executed found it in under a minute.
      - name: Build and typecheck
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run --project unit

  statistical-gate:
    name: Statistical Gate
    runs-on: ubuntu-latest
    # Runs on every push to main as well as on pull requests.
    #
    # It was skipped on push while the repository was private, because Actions
    # minutes cost money and these are long-running simulations. The repository
    # is public now and standard-runner minutes are free, so the reason is gone —
    # and this suite is where every substantive claim in the project lives: the
    # adversarial battery, the mirror test, the withheld red-team families, the
    # economic-blindness demonstration, the long-horizon coverage.
    #
    # Leaving it off `main` would mean the project's actual evidence was still
    # attested only by the operator who produced it, which is the thing hosted CI
    # was reinstated to fix (ADR-0009).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The apps/api suites spawn the built service as a child process, so this
      # job needs the build too. Without it they fail as `service exited (1)`.
      - name: Build
        run: npm run build
      - name: Statistical tests
        # The phase-acceptance run holds ~24M ticks in typed arrays plus the
        # precomputed feature frame, which needs more heap than the default.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --project statistical
