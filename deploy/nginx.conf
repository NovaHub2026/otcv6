# The engine behind nginx (PH-30.1): read routes to the world, the stream
# unbuffered, the admin routes cut, the client address forwarded for the rate
# limit.
#
# **This file loads as it ships.** It listened on `443 ssl` and declared no
# certificate, which nginx rejects at parse time — `no "ssl_certificate" is
# defined for the "listen ... ssl" directive` — so the one layer that cuts the
# write surface was the one piece of the deployment that could never start, and
# `nginx -t` failed on a host that may already be serving another site (the
# readiness audit of 2026-09-28). It listens on 80 now, for a deployment that
# terminates TLS in front of it, which is what the line above always said.
#
# To terminate TLS **here** instead, replace the `listen 80;` below with these
# four lines and real paths — nginx will not start until both files exist:
#
#     listen 443 ssl;
#     http2 on;                     # not `listen ... ssl http2`, deprecated in 1.25
#     ssl_certificate     /etc/letsencrypt/live/otc.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/otc.example.com/privkey.pem;
upstream otc_engine {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name otc.example.com;

    # The write surface never leaves the machine; the panel's proxy adds the
    # token on its own server.
    #
    # `~*`, not `~`: nginx's `~` is case-sensitive and the engine's router is not,
    # so `/Assets/eurusd-otc` fell through this block and reached the write
    # surface, and `/Metrics` and `/metrics/` reached the monitor surface below
    # (the readiness audit of 2026-09-28). The engine refuses a path whose case
    # does not match since the same audit, but a proxy is the layer an operator
    # copies, and it must be right on its own.
    location ~* ^/assets {
        return 403;
    }

    location / {
        proxy_pass http://otc_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        # Read by the engine only when OTC_TRUSTED_PROXIES says how many hops
        # to trust — 1 behind this file. The compose file and the systemd unit
        # both set it; a deployment that copies this proxy alone must too, or
        # the engine's rate limit puts every client in one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: without these the ticks arrive in bursts, or not at all.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # /metrics and /health/ready belong to your monitor, not the public.
        # `~*` and an optional trailing slash, for the reason above.
        #
        # The allowed set covers where a monitor actually runs in the topologies
        # this directory ships: the same host, a Docker bridge, and either private
        # range. It allowed 10/8 alone, which excludes all three of the shipped
        # ones — the engine on loopback, compose publishing on 127.0.0.1, and
        # Docker's default 172.16/12 — so the operator's dashboards went blank
        # while every container stayed healthy, because the container's own probe
        # does not pass through here (the readiness audit of 2026-09-28).
        # **Narrow this to your monitor's address**; it is deliberately wider than
        # yours needs to be, and it is still not public.
        location ~* ^/(metrics|health/ready)/?$ {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://otc_engine;
        }
    }
}
