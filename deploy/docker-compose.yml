# The engine and its backup timer, one state volume (PH-30.1).
#
#   OTC_MASTER_SECRET=... OTC_ADMIN_TOKEN=... docker compose -f deploy/docker-compose.yml up -d
#
# The engine listens on every interface inside its container and is published
# on loopback only; put deploy/nginx.conf in front of it for the world.
#
# The administration UI is a separate Next.js process and is not composed here —
# deploy/Dockerfile copies no apps/web. INTEGRATION.md §6 describes it: its
# screens, its proxies, its variables and the `npm start` inside apps/web. This
# header claimed a panel service for two phases and PH-30.1 §2 repeated the
# claim (Cycle Audit 10, a5-04).
services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: otc-engine:local
    environment:
      OTC_MASTER_SECRET: ${OTC_MASTER_SECRET:?set OTC_MASTER_SECRET}
      OTC_ADMIN_TOKEN: ${OTC_ADMIN_TOKEN:-}
      OTC_PUBLISHING_KEY: ${OTC_PUBLISHING_KEY:-}
      OTC_PUBLICATION_DIR: /var/lib/otc/publication
      OTC_RATE_LIMIT_PER_MINUTE: ${OTC_RATE_LIMIT_PER_MINUTE:-600}
      # One hop: nginx below is the only thing that talks to the engine, and it
      # forwards the client in X-Forwarded-For. Without this the rate limit
      # keys every client on nginx's own address and they share one bucket
      # (Cycle Audit 10). Raise it only if you add another proxy in front.
      OTC_TRUSTED_PROXIES: ${OTC_TRUSTED_PROXIES:-1}
    volumes:
      - otc-state:/var/lib/otc
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
  # The same image as the engine, not a stock node with the host's checkout
  # mounted in (Cycle Audit 10, a5-04). What it runs is
  # `tools/sim/dist/stateTool.js`, which exists only after `npm run build` and
  # is excluded by .gitignore, so mounting a fresh clone gave the service
  # nothing to execute — and the image is where the build happens. Compose
  # builds `otc-engine:local` once and both services use it.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: otc-engine:local
    depends_on:
      engine:
        condition: service_healthy
    volumes:
      - otc-state:/var/lib/otc
      - otc-backups:/backups
    # Every six hours, a verified copy; the last eight are kept (deploy/backup.sh).
    command: ['bash', 'deploy/backup.sh', '/var/lib/otc', '/backups', '8', '21600']
    restart: unless-stopped

volumes:
  otc-state:
  otc-backups:
