# The engine and the panel, one state volume (PH-30.1).
#
#   OTC_MASTER_SECRET=... OTC_ADMIN_TOKEN=... docker compose -f deploy/docker-compose.yml up -d
#
# The engine listens on every interface inside its container and is published
# on loopback only; put deploy/nginx.conf in front of it for the world.
services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      OTC_MASTER_SECRET: ${OTC_MASTER_SECRET:?set OTC_MASTER_SECRET}
      OTC_ADMIN_TOKEN: ${OTC_ADMIN_TOKEN:-}
      OTC_PUBLISHING_KEY: ${OTC_PUBLISHING_KEY:-}
      OTC_PUBLICATION_DIR: /var/lib/otc/publication
      OTC_RATE_LIMIT_PER_MINUTE: ${OTC_RATE_LIMIT_PER_MINUTE:-600}
    volumes:
      - otc-state:/var/lib/otc
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
  backup:
    image: node:24-slim
    depends_on:
      engine:
        condition: service_healthy
    volumes:
      - otc-state:/var/lib/otc
      - otc-backups:/backups
      - ..:/opt/otc:ro
    working_dir: /opt/otc
    # Every six hours, a verified copy; the last eight are kept (deploy/backup.sh).
    command: ['bash', 'deploy/backup.sh', '/var/lib/otc', '/backups', '8', '21600']
    restart: unless-stopped

volumes:
  otc-state:
  otc-backups:
